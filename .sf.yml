# Software Factory per-project config. The factory reads this from the repo root.
# Only `test:` is consumed today (stage 4); the rest are placeholders for stages
# 4–5 and will be wired as those stages land.

# Stage 4 (/sf-test): shell command run in the issue's worktree. Exit 0 = pass
# (→ sf:ready-for-prod), non-zero = fail (→ sf:needs-debug). For a monorepo,
# cd into the subproject: e.g. `cd enroute-kpis-local && python -m pytest -q`.
test: bash tests/smoke.sh

# staging_url:            # (later) smoke-tested after a staging deploy

# Stage 5 (sf-prod.sh, human-triggered): production deploy command, run in the
# issue's worktree. Exit 0 = deployed (→ sf:deployed, issue closed), non-zero =
# failed (→ sf:deploy-failed). softwarefactory has no real prod target, so this
# is a safe placeholder that reports the plugin version.
deploy: bash tests/smoke.sh && echo "🚀 placeholder deploy OK — softwarefactory has no real production target"
